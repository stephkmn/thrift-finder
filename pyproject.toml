[project]
name = "thrift-finder-backend"
version = "0.1.0"
description = "Thrift Searcher backend — FastAPI service for outerwear attribute extraction and listing search."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # Used by app/ml/ outside the model itself (vocabulary, scoring), so CI can test it without torch.
    "numpy>=1.26",
    "pyyaml>=6.0",
    # /api/extract decodes uploads before calling the model; small, so CI tests decoding without torch.
    "pillow>=10.4",
]

[project.optional-dependencies]
# Model runtime (Member A). Heavy: torch alone is several hundred MB, so CI skips it.
ml = [
    "torch>=2.3",
    "transformers>=4.44",
    "pillow>=10.4",
]
# Member B (Data Lead) will append httpx, etc. here.
data = ["datasets>=3.2", "Pillow>=10.0"]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
